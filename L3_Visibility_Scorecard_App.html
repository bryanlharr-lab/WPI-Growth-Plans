<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1F4E9C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>L3 Visibility Scorecard</title>
<style>
:root{--blue:#1F4E9C;--ink:#222;--mut:#5b6472;--line:#d6deea;--soft:#eef3fb;--green:#2e9e4f;--amber:#e0a800;--red:#c0392b;--bg:#f4f6fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:15px}
button,input,select{font:inherit}
.app{max-width:900px;margin:0 auto;padding:12px 16px 60px}
header.bar{display:flex;align-items:center;gap:10px;padding:8px 0 12px}
header.bar img{height:34px}
header.bar h1{font-size:17px;margin:0;color:var(--blue);flex:1}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--blue)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:bold}
.btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.results .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;margin-top:8px;cursor:pointer}
.results .opt:hover{border-color:var(--blue)}
.results .opt b{color:var(--blue)}
.status{font-size:13.5px;color:var(--mut);margin-top:8px;min-height:18px}
.status.err{color:var(--red)}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.hidden{display:none!important}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.history button{margin:4px 6px 0 0}
/* ---------- report ---------- */
#report{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
.r-top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--blue);padding-bottom:6px}
.r-top img{height:52px}
.r-title{text-align:right}
.r-title h3{margin:0;font-size:22px;color:var(--blue);letter-spacing:.5px}
.r-title div{font-size:12.5px;color:var(--mut)}
.r-title input{width:auto;display:inline;padding:0 2px;border:0;border-bottom:1px dashed #aab;border-radius:0;font-weight:bold;color:var(--ink);font-size:12.5px;text-align:right}
#report h4{font-size:13px;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:2px}
.snap{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.tile .v{font-size:24px;font-weight:bold;color:var(--blue)}
.tile .l{font-size:10.5px;color:var(--mut);text-transform:uppercase}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--blue);color:#fff;text-align:left;padding:5px 6px;white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid #e3e8f0}
tr.me td{background:var(--soft);font-weight:bold}
.two{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.gridwrap{position:relative;margin-left:16px}
.grid{display:grid;gap:5px}
.cell{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:13px}
.pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.small{font-size:12px;color:var(--mut)}
.legend span{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 3px 0 8px;vertical-align:middle}
ul.chk{list-style:none;padding:0;margin:0;columns:2;font-size:13.5px}
ul.chk li{margin:2px 0;cursor:pointer;break-inside:avoid}
.ok{color:var(--green);font-weight:bold}.no{color:var(--red);font-weight:bold}.q{color:#b26a00;font-weight:bold}
.next{background:var(--soft);border-left:4px solid var(--blue);padding:8px 10px;font-size:13.5px}
.next [contenteditable]{outline:none}
.foot{margin-top:12px;border-top:1px solid var(--blue);padding-top:4px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:640px){
 .row,.row3{grid-template-columns:1fr}
 #report{padding:14px}
 .r-top{flex-direction:column;align-items:flex-start}.r-title{text-align:left}.r-title input{text-align:left}
 .snap{grid-template-columns:1fr}
 .tiles{grid-template-columns:1fr 1fr}
 .two{grid-template-columns:1fr}
 .gridwrap{margin:0 auto}
 ul.chk{columns:1}
}
@media print{
 @page{size:letter;margin:.45in .7in}
 body{background:#fff}
 .app{max-width:none;padding:0}
 .noprint,header.bar{display:none!important}
 #report{border:0;padding:0}
 .r-top{flex-direction:row}.r-title{text-align:right}
 .snap{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:repeat(4,1fr)}
 .two{grid-template-columns:auto 1fr}ul.chk{columns:2}
 .r-title input{border:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head>
<body><div class="app">
<header class="bar noprint"><img id="hdrLogo" alt="Level 3"><h1>Visibility Scorecard</h1><button class="iconbtn" id="setBtn">Settings</button></header>

<div class="card noprint hidden" id="settings">
 <h2>Settings (saved on this device only)</h2>
 <label>Outscraper API key</label>
 <input id="apiKey" type="password" autocomplete="off" placeholder="Paste your key from Outscraper → Profile → API key">
 <div class="row3">
  <div><label>Default grid</label><select id="defGrid"><option value="3">3 × 3 (9 points)</option><option value="4" selected>4 × 4 (16 points)</option><option value="5">5 × 5 (25 points)</option></select></div>
  <div><label>Spacing</label><select id="defSpace"><option value="0.5">0.5 mi</option><option value="1" selected>1 mi</option><option value="2">2 mi</option></select></div>
  <div><label>Results checked per point</label><select id="defLimit"><option value="10" selected>Top 10</option><option value="20">Top 20</option></select></div>
 </div>
 <div class="actions" style="margin-top:12px"><button class="btn" id="saveSet">Save settings</button></div>
 <div class="hint">Each point uses one Outscraper result per business checked (for example, 16 points × top 10 = 160 results). Outscraper's free monthly allowance covers most single scans.</div>
</div>

<div class="card noprint" id="finder">
 <h2>1. Find the merchant</h2>
 <div class="row">
  <div><label>Business name + city</label><input id="q" placeholder="e.g. Serenity Nails Catoosa OK"></div>
  <div><label>Search term customers use</label><input id="kw" placeholder="e.g. nail salon"></div>
 </div>
 <div class="actions" style="margin-top:12px"><button class="btn" id="findBtn">Find business</button></div>
 <div class="status" id="findStatus"></div>
 <div class="results" id="results"></div>
 <div class="history" id="history"></div>
</div>

<div class="card noprint hidden" id="runCard">
 <h2>2. Run the rank grid</h2>
 <div id="picked" style="font-size:14px"></div>
 <div class="row3">
  <div><label>Grid</label><select id="grid"><option value="3">3 × 3</option><option value="4">4 × 4</option><option value="5">5 × 5</option></select></div>
  <div><label>Spacing</label><select id="space"><option value="0.5">0.5 mi</option><option value="1">1 mi</option><option value="2">2 mi</option></select></div>
  <div><label>Check top</label><select id="limit"><option value="10">10</option><option value="20">20</option></select></div>
 </div>
 <div class="hint" id="costHint"></div>
 <div class="actions" style="margin-top:10px"><button class="btn" id="runBtn">Run scan</button></div>
 <div class="prog" id="prog"><i></i></div>
 <div class="status" id="runStatus"></div>
</div>

<div class="actions noprint hidden" id="repActions">
 <button class="btn" id="printBtn">Print / Save as PDF</button>
 <button class="btn sec" id="newBtn">New merchant</button>
</div>
<div id="report" class="hidden"></div>
</div>

let S=store.get('settings',{key:'',grid:'4',space:'1',limit:'10'});
let picked=null,lastKw='';

function applySettings(){ $('apiKey').value=S.key||''; $('defGrid').value=S.grid; $('defSpace').value=S.space; $('defLimit').value=S.limit; }
applySettings();
if(!S.key) $('settings').classList.remove('hidden');

$('kw').value=store.get('lastKw','nail salon');

async function call(params){
 if(!S.key) throw new Error('Add your Outscraper API key in Settings first.');
 const p=new URLSearchParams(Object.assign({async:'false',language:'en',region:'US'},params));
 const r=await fetch(API+'?'+p,{headers:{'X-API-KEY':S.key}});
 let j=null; try{j=await r.json()}catch(e){}
 if(r.status===401||r.status===403) throw new Error('Outscraper rejected the API key. Check it in Settings.');
 if(r.status===402) throw new Error('Outscraper says the account balance is too low.');
 if(!r.ok||!j) throw new Error('Outscraper error ('+r.status+'). Try again in a minute.');
 if(j.error) throw new Error(j.errorMessage||'Outscraper error.');
 return (j.data&&j.data[0])||[];
}

// ---------- step 1 ----------
$('findBtn').onclick=async()=>{
 const q=$('q').value.trim(); if(!q){$('q').focus();return}
 lastKw=$('kw').value.trim()||'nail salon'; store.set('lastKw',lastKw);
 $('findStatus').className='status'; $('findStatus').textContent='Searching Google Maps…'; $('results').innerHTML='';
 try{
  const list=await call({query:q,limit:'5'});
  if(!list.length){$('findStatus').textContent='No match found. Add the city or street to the name.';return}
  $('findStatus').textContent='Tap the right business:';
  $('results').innerHTML=list.map((x,i)=>`<button class="opt" data-i="${i}"><b>${esc(x.name)}</b> · ${x.rating??'–'}★ (${x.reviews??0} reviews)<br><span class="small">${esc(x.full_address||x.address||'')}</span></button>`).join('');
  [...$('results').querySelectorAll('.opt')].forEach(b=>b.onclick=()=>pick(list[+b.dataset.i]));
 }catch(e){$('findStatus').className='status err';$('findStatus').textContent=e.message}
};

function pick(x){
 picked=x; $('results').innerHTML=''; $('findStatus').textContent='';
 $('picked').innerHTML=`<b>${esc(x.name)}</b> · ${esc(x.full_address||'')}<br><span class="small">Search term: "${esc(lastKw)}"</span>`;
 $('grid').value=S.grid;$('space').value=S.space;$('limit').value=S.limit; costHint();
 $('runCard').classList.remove('hidden'); $('runStatus').textContent=''; $('runCard').scrollIntoView({behavior:'smooth'});
}
function costHint(){const n=+$('grid').value,l=+$('limit').value;$('costHint').textContent=`${n*n} search points × top ${l} = about ${n*n*l} Outscraper results.`}
['grid','limit'].forEach(id=>$(id).onchange=costHint);

// ---------- step 2 ----------
$('runBtn').onclick=async()=>{
 if(!picked) return;
 const N=+$('grid').value, sp=+$('space').value, L=+$('limit').value;
 const lat=picked.latitude,lng=picked.longitude;
 const dLat=sp/69.0, dLng=sp/(69.17*Math.cos(lat*Math.PI/180));
 const pts=[];
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const a=((N-1)/2-r),b=(c-(N-1)/2);pts.push({r,c,la:(lat+a*dLat).toFixed(6),lo:(lng+b*dLng).toFixed(6)})}
 $('runBtn').disabled=true; $('prog').style.display='block'; const bar=$('prog').firstElementChild; bar.style.width='0';
 $('runStatus').className='status'; $('runStatus').textContent='Checking Google Maps from each point…';
 const res=new Array(pts.length); let done=0,idx=0,failed=null;
 async function worker(){while(idx<pts.length&&!failed){const i=idx++;const p=pts[i];
   try{res[i]=await call({query:lastKw,coordinates:`@${p.la},${p.lo},14z`,limit:String(L),fields:'name,place_id,rating,reviews,full_address'})}
   catch(e){failed=e;return}
   done++;bar.style.width=(done/pts.length*100)+'%';$('runStatus').textContent=`Checked ${done} of ${pts.length} points…`}}
 await Promise.all([worker(),worker(),worker(),worker()]);
 $('runBtn').disabled=false;
 if(failed){$('runStatus').className='status err';$('runStatus').textContent=failed.message;return}
 const report=buildReport(picked,res,{N,sp,L,kw:lastKw});
 saveHistory(report); render(report);
 $('runStatus').textContent='Done.'; $('prog').style.display='none';
};

function buildReport(biz,res,opt){
 const stats={};
 res.forEach((list,i)=>list.forEach((x,k)=>{const s=stats[x.place_id]||(stats[x.place_id]={id:x.place_id,name:x.name,rating:x.rating,reviews:x.reviews,addr:x.full_address||'',ranks:new Array(res.length).fill(0)});s.ranks[i]=k+1}));
 const miss=opt.L+1;
 Object.values(stats).forEach(s=>{s.avg=s.ranks.reduce((a,v)=>a+(v||miss),0)/s.ranks.length;s.top3=s.ranks.filter(v=>v&&v<=3).length});
 const me=stats[biz.place_id]||{ranks:new Array(res.length).fill(0),avg:miss,top3:0};
 const comps=Object.values(stats).filter(s=>s.id!==biz.place_id).sort((a,b)=>a.avg-b.avg).slice(0,3);
 const nearest=comps.length?Math.max(...comps.map(c=>c.reviews||0)):0;
 return {when:new Date().toISOString(),opt,prepFor:biz.owner_title||biz.name,
  biz:{id:biz.place_id,name:biz.name,addr:biz.full_address||'',street:biz.street||'',phone:biz.phone||'',site:biz.website||biz.site||'',rating:biz.rating,reviews:biz.reviews||0,type:biz.type||biz.category||'',hours:biz.working_hours||null,verified:!!biz.verified,photos:biz.photos_count||0,booking:!!(biz.booking_appointment_link||(biz.reservation_links&&biz.reservation_links.length)),posts:!!(biz.posts&&biz.posts.length)},
  ranks:me.ranks,avg:me.avg,top3:me.top3,
  comps:comps.map(c=>({name:c.name,addr:c.addr,rating:c.rating,reviews:c.reviews,avg:c.avg,top3:c.top3})),
  ratio:nearest?(biz.reviews||0)/nearest:null,
  checks:null,note:null};
}

function hoursText(h){
 if(!h) return '—';
 const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],ab=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
 const v=days.map(d=>(h[d]||['—']).join(', '));const out=[];let s=0;
 for(let i=1;i<=7;i++){if(i===7||v[i]!==v[s]){out.push((s===i-1?ab[s]:ab[s]+'–'+ab[i-1])+' '+v[s]);s=i}}
 return out.join(' · ');
}
const col=v=>!v?'var(--red)':v<=3?'var(--green)':v<=10?'var(--amber)':'var(--red)';
const f1=n=>(Math.round(n*10)/10).toFixed(1);

function defaultChecks(b,rep){
 return [
  ['Google profile verified (claimed)',b.verified?1:0],['Phone number listed',b.phone?1:0],
  ['Hours listed',b.hours?1:0],['Website linked',b.site?1:0],
  ['Online booking link',b.booking?1:0],['Rating 4.5 or higher',(b.rating||0)>=4.5?1:0],
  ['50+ photos on profile',b.photos>=50?1:0],['Google posts active',b.posts?1:2],
  ['Owner replies to recent reviews',2],['Review requests sent after each visit',2]];
}
function defaultNote(rep){
 const b=rep.biz,N=rep.opt.N*rep.opt.N,c=rep.comps[0];
 const lead=rep.top3>=N*0.75?`<b>${esc(b.name)}</b> shows up in Google's top 3 at <b>${rep.top3} of ${N}</b> search points`:
  rep.top3>=N*0.4?`<b>${esc(b.name)}</b> shows up in Google's top 3 at only <b>${rep.top3} of ${N}</b> search points`:
  `<b>${esc(b.name)}</b> is <b>missing from Google's top 3 at ${N-rep.top3} of ${N}</b> search points`;
 const rev=rep.ratio&&rep.ratio>=1.2?`, with ${rep.ratio.toFixed(1)}× the reviews of its closest competitor`:(c?`, while ${esc(c.name)} ranks higher at an average of #${f1(c.avg)}`:'');
 const opp=rep.top3>=N*0.75?`The opportunity isn't getting found. It's <b>keeping that lead</b> and turning it into repeat visits: automatic rebooking reminders, win-back messages to clients who haven't been in for 60–90 days, and fast replies to every new review.`:
  `Every point where a competitor ranks higher is a customer who never sees this business. More reviews, active Google posts and fast review replies move the needle, and automatic follow-ups turn those new customers into regulars.`;
 return `${lead}${rev}. ${opp}<br><b>Next step:</b> a 5-minute walkthrough of the rank grid and a 30-day plan.`;
}

function render(rep){
 const b=rep.biz,N=rep.opt.N;
 if(!rep.checks) rep.checks=defaultChecks(b,rep);
 if(!rep.note) rep.note=defaultNote(rep);
 const cs=N===5?30:N===3?44:38, gap=5, W=N*cs+(N-1)*gap;

 const sym=['<span class="no">✗</span>','<span class="ok">✓</span>','<span class="q">?</span>'];
 $('report').innerHTML=`
 <div class="r-top"><img src="${LOGO}" alt="Level 3"><div class="r-title"><h3>LOCAL VISIBILITY SCORECARD</h3>
 <div>Prepared for <input id="prepFor" value="${esc(rep.prepFor)}" size="${Math.max(12,rep.prepFor.length)}"> · ${month}</div><div>Prepared by Bryan Harr, Level 3 Growth Advisors</div></div></div>

 <div class="snap"><div><b>Business:</b> ${esc(b.name)}</div><div><b>Category:</b> ${esc(b.type||'—')}</div>
 <div><b>Address:</b> ${esc(b.addr)}</div><div><b>Phone:</b> ${esc(b.phone||'—')}</div>
 <div><b>Hours:</b> ${esc(hoursText(b.hours))}</div><div><b>Online booking:</b> ${b.booking?'Yes':'Not found'}</div></div>
 <h4>Scores at a Glance</h4>
 <div class="tiles"><div class="tile"><div class="v">${b.rating??'–'}★</div><div class="l">Google rating</div></div>
 <div class="tile"><div class="v">${b.reviews}</div><div class="l">Google reviews</div></div>
 <div class="tile"><div class="v">${f1(rep.avg)}${rep.avg>rep.opt.L?'+':''}</div><div class="l">Avg. map rank</div></div>
 <div class="tile"><div class="v">${rep.top3}/${N*N}</div><div class="l">Top-3 grid points</div></div></div>
 <h4>Competitor Comparison</h4>
 <div class="tbl"><table><tr><th>Business</th><th>Address</th><th>Rating</th><th>Reviews</th><th>Avg. rank</th><th>Top-3 spots</th></tr>${rows}</table></div>
 <h4>Google Map Pack Rank Grid</h4>
 <div class="two"><div class="gridwrap" style="width:${W}px"><div class="grid" style="grid-template-columns:repeat(${N},${cs}px)">${cells}</div><div class="pin" style="left:50%;top:50%">★</div></div>
 <div><b>Search term:</b> "${esc(rep.opt.kw)}" · <b>Grid:</b> ${N} × ${N} (${N*N} points), ${rep.opt.sp} mi spacing, centered on the business (★)
 <p class="small">Each circle shows where ${esc(b.name)} ranks on Google Maps when a customer searches from that spot. "–" means not in the top ${rep.opt.L}.</p>
 <div class="legend small"><span style="background:var(--green)"></span>1–3 (Map Pack)<span style="background:var(--amber)"></span>4–10<span style="background:var(--red)"></span>11+ / not found</div></div></div>
 <h4>Profile Health Check</h4>
 <ul class="chk">${rep.checks.map((c,i)=>`<li data-i="${i}" title="Tap to change">${sym[c[1]]} ${esc(c[0])}</li>`).join('')}</ul>
 <h4>What This Means</h4>
 <div class="next"><div contenteditable="true" id="note">${rep.note}</div></div>
 <div class="foot"><span><b>Bryan Harr</b> · Level 3 Growth Advisors · 918-565-1333 · bryan.harr@level3ga.com · level3ga.com</span><span>Data: Google Maps via Outscraper, ${day}</span></div>`;
 [...$('report').querySelectorAll('ul.chk li')].forEach(li=>li.onclick=()=>{const c=rep.checks[+li.dataset.i];c[1]=c[1]===1?0:c[1]===0?2:1;saveHistory(rep);render(rep)});
 $('prepFor').oninput=e=>{rep.prepFor=e.target.value;saveHistory(rep)};
 $('note').oninput=e=>{rep.note=e.target.innerHTML;saveHistory(rep)};
 $('report').classList.remove('hidden');$('repActions').classList.remove('hidden');$('runCard').classList.add('hidden');$('finder').classList.add('hidden');
 window.scrollTo({top:0,behavior:'smooth'});
 current=rep;
}
let current=null;
function saveHistory(rep){let h=store.get('history',[]);h=h.filter(x=>x.when!==rep.when);h.unshift(rep);store.set('history',h.slice(0,15));showHistory()}
function showHistory(){const h=store.get('history',[]);$('history').innerHTML=h.length?`<label>Recent scorecards on this device</label>`+h.map((r,i)=>`<button class="btn sec" data-i="${i}">${esc(r.biz.name)} · ${new Date(r.when).toLocaleDateString()}</button>`).join(''):'';
 [...$('history').querySelectorAll('button')].forEach(b=>b.onclick=()=>render(store.get('history',[])[+b.dataset.i]))}
showHistory();
$('printBtn').onclick=()=>window.print();
$('newBtn').onclick=()=>{$('report').classList.add('hidden');$('repActions').classList.add('hidden');$('finder').classList.remove('hidden');$('q').value='';picked=null;showHistory();window.scrollTo({top:0})};
})();
</script>
</body></html>
